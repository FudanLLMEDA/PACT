# ============================================================================
# Per-skill guidance injected into the LLM system prompt (generated by
# FDAgents.prompts). This is KNOWLEDGE, not policy: nothing here is enforced.
#
# Heuristics that used to be hard-coded absolute-WNS gates are expressed as
# generalized, clock-period-relative guidance so they transfer to unseen
# designs.
#
# Fields:
#   summary      one-line description
#   targets      what the `target` field means
#   when         when this skill tends to pay off
#   avoid        known failure modes / when it wastes budget
#   key_params   notable params (defaults live in config.yaml skills.defaults)
#   risk         low|medium|high — chance of losing the current routed state
#                (the agent auto-rolls back, so risk = wasted time, not damage)
# ============================================================================

phys_opt:
  summary: Run one fixed phys_opt_design directive or flag preset on the routed design.
  targets: "fixed routed preset: Default | Explore | AggressiveExplore | AggressiveFanoutOpt | AddRetime | equ_drivers | routing_critical_pin | placement_critical_cell | clock_opt"
  when: >
    Cheap first probe on almost any failing design; also a good final polish
    after structural moves. Explore/AggressiveExplore pay off on
    route-dominated near-closure states (|WNS| within ~10% of clock period).
  avoid: >
    Repeating directives that already returned "no-op" warnings; expecting
    it to fix deep structural problems (>1 ns) alone.
  key_params: {}
  risk: low

implementation_recipe:
  summary: Execute one fixed full implementation recipe through a typed backend.
  targets: "fixed preset from the Phase 2 executable preset catalog"
  when: >
    A matched case calls for a proven high-utilization target-period flow,
    full retime route, extreme-clock-pressure rebuild, or clock cleanup. The
    derived_pressure_replace_route_v1 target derives temporary pressure from
    the current measured achievable period rather than a benchmark constant.
  avoid: Selecting a preset whose resource-family evidence does not match the design.
  key_params: {}
  risk: high

fanout_opt:
  summary: RapidWright net splitting — replicate the driver of one high-fanout net into k copies.
  targets: net name (from suggested_targets / timing reports)
  when: >
    Fanout-class bottleneck with actionable (non-clock, non-macro-pin) nets.
    Scale split_factor with fanout: ~3 for 100+, 4 for 500+, 5 for 1500+.
  avoid: >
    Nets with fanout < ~20 (no leverage, historically even fanout=1 mistakes);
    clock/reset trees; BRAM/DSP address plumbing (use naming filters);
    grinding more splits when seed-scoped measured Fmax evidence is saturated.
  key_params: {split_factor: "driver copies", accept_min_delta_ns: "per-skill accept floor"}
  risk: medium

cell_replace:
  summary: RapidWright relocation of detoured cells toward their timing-optimal spot.
  targets: "'auto' or a specific cell name"
  when: Placement-class bottleneck with long wire detours (detour analysis in reports).
  avoid: Route-dominated designs where placement is already tight.
  key_params: {detour_threshold: "min detour ratio to act on"}
  risk: medium

pblock_sweep:
  summary: Generate ordered independent SLICE-only pblock place/route siblings from one seed.
  targets: "'auto' (candidates generated from fabric analysis) or explicit SLICE range"
  when: >
    Low-utilization fabric-only designs whose critical paths are
    route-dominated (avg route share >= ~65-70%) — compacting the design
    shortens wires globally. On such profiles this should come BEFORE mass
    replication (LogicNets evidence: pblock first 484.7 MHz, replicate after).
  avoid: >
    Designs with hard macros on critical paths (the sweep will refuse:
    SLICE-only ranges can't contain BRAM/DSP) — use `pblock` instead;
    starting a sweep with < ~20 min left (each candidate is a full
    place+route).
  key_params: {max_candidates: "floorplan candidates to try", min_candidate_remaining_s: "stop before another sibling and return the completed prefix"}
  risk: high

pblock:
  summary: Resource-aware pblock (can include BRAM/DSP columns), optionally guidance-only.
  targets: "'auto' or explicit range string"
  when: >
    Hard-macro designs needing floorplan guidance; memory-address profiles
    (guidance seed then fresh route); after pblock_sweep refused due to hard
    macros.
  avoid: Tight deadlines (full place+route per candidate).
  key_params:
    guidance_only: "place inside, then release constraint before route"
    release_after_place: "soft guidance mode"
    place_directive: "directive for the constrained placement"
  risk: high

lut_merge:
  summary: RapidWright merge of chained LUTs in the critical fan-in cone.
  targets: "'auto' or endpoint cell name"
  when: Logic-depth bottleneck (max logic levels >= ~7) with LUT headroom.
  avoid: Very high LUT utilization (>= ~85%) — no headroom, merges get undone by legalization.
  key_params: {min_luts_in_fanin: "cone size floor"}
  risk: medium

per_net_unroute:
  summary: Unroute + reroute a handful of specific nets with better directives.
  targets: net name
  when: >
    Mid-fanout nets (roughly 20-100) on the worst path when the rest of the
    route is healthy; surgical, preserves everything else.
  avoid: Broad problems (dozens of failing endpoints) — too slow per net.
  risk: low

force_replicate:
  summary: >
    Vivado phys_opt -force_replication_on_nets on harvested critical
    high-fanout nets, then (scope-dependent) unroute + reroute.
  targets: "net name, or 'auto_highfanout_group' to harvest a group from timing"
  when: >
    Few actionable critical fanout nets (targeted) or grouped harvesting on
    large fanout-dominated designs. The strongest single lever on
    replication-class profiles (mini-isp +100 MHz, finn +60 MHz evidence).
  avoid: >
    unroute_scope=global with < ~20 min left (full reroute); clock-like and
    hard-macro-pin nets (filtered automatically); repeating on the same net
    after a clean no-gain.
  key_params:
    unroute_scope: "global (full reroute, thorough) vs local"
    route_directive: "NoTimingRelaxation is the evidence-backed default for quality"
    passes: "harvest+replicate iterations"
  risk: high

checkpoint_import:
  summary: Import a previously saved better checkpoint (e.g. from a sweep artifact).
  targets: path to .dcp produced earlier in THIS run
  when: Recovering the best intermediate state after risky exploration.
  risk: low

lut_pin_swap:
  summary: RapidWright LUT pin-swap and route siblings from the seed; later greedy iterations remain serial descendants.
  targets: "'auto'"
  when: >
    Route-clean near-closure states (|WNS| within ~8% of clock period) on
    route-dominated profiles, typically after a first cleanup pass and
    before the final reroute polish.
  avoid: Far-from-closure states — the sub-0.1 ns gains vanish into noise.
  key_params: {max_pins: "", max_cells: "", max_iterations: "", route_directives: "reroute variants tried after swaps"}
  risk: low

post_route_cleanup:
  summary: Independent first-pass cleanup recipe siblings; later greedy passes remain serial descendants.
  targets: >
    'auto' | 'pre_lut_directive' (cleanup before LUT-level surgery) |
    'post_lut_cleanup' (single bounded pass after LUT surgery)
  when: >
    Near closure (|WNS| within ~7-10% of the clock period, or dominant
    bottleneck 'routing' with route share >= ~65%). The classic sequence on
    route-dominated profiles: pre_lut_directive cleanup -> phys_opt Explore
    -> lut_pin_swap -> post_lut_cleanup -> final surgical reroute.
  avoid: >
    Deep-slack states (cleanup can't move >0.5 ns); unbounded iteration —
    keep max_candidates*max_iterations small vs remaining time (~5 min per
    attempt).
  key_params: {recipes: "registered recipe names only", max_candidates: "", max_iterations: ""}
  risk: low

critical_net_reroute:
  summary: Ordered independent reroute siblings for small worst-path net windows.
  targets: "'auto' | 'worst_source' | 'early_window' | 'high_delay10' | 'top3_final'"
  when: >
    Micro-ECO for the endgame: after broad cleanup is exhausted, very near
    closure. 'worst_source' reroutes only the current worst path's source-cell
    output net; 'high_delay10'/'top3_final' are final-polish moves when |WNS|
    is within ~6-8% of the clock period.
  avoid: Using final-polish targets while still far from closure.
  key_params: {max_fanout: "net size cap", window_size: "", selection_mode: ""}
  risk: low

selective_branch_reroute:
  summary: Analyze exact sink connections, remove only certified private branches in RapidWright, then preserve-route the newly unrouted branch in Vivado.
  targets: "'auto_high_detour' | 'verified_connections' with exact physical_net/sink_pin pairs"
  when: >
    Endgame repair for one to four high-detour sink connections on branched data
    nets when preserving every other sink route matters more than broad exploration.
  avoid: >
    Clock/static/fixed nets, ambiguous sinks, route islands, or any connection
    without a current shared-trunk safety certificate; the tool fails closed.
  key_params: {max_branches: "1..4", min_detour_ratio: "auto selection floor", route_directives: "Default only; reroute uses preserve mode"}
  risk: low

structure_relocation:
  summary: Exact physical translation of one complete analysis-derived carry cloud or hard-macro cascade, preserving only safely translatable internal routes.
  targets: "'carry_cloud' | 'hard_macro_cascade'"
  when: A complete unlocked structure is poorly located and a small integer tile translation has compatible empty destination sites.
  avoid: >
    Arbitrary cell clusters are not supported. Mixed or unknown placement,
    fixed/locked members or PIPs, branched/broken dedicated topology,
    clock/static boundary risk, stale IDs, and incomplete site membership all
    fail closed. exact_cluster means the complete carry/macro analysis set only.
  key_params: {structure_id: "auto or digest-bound analysis ID", offsets: "1..8 integer [column,row] pairs in -32..32", max_candidates: "1..4 ordered prefix", route_directive: "fixed allowlist only"}
  risk: medium

equivalent_source_remap:
  summary: Rewire one critical sink to a closer source only after exact FF/LUT source-equivalence proof.
  targets: "'auto_nearest_proven' or an exact-seed fresh-analysis certificate_id"
  when: A far FDRE/FDSE/FDCE/FDPE or LUT1..LUT6 source has a mechanically proven closer equivalent source.
  avoid: >
    Any missing or multi-driver pin, black box, routethru, ambiguous LUT permutation,
    unsupported primitive, folded EDIF, or certificate mismatch fails closed. This ECO
    proof is not final functional equivalence and never authorizes submission.
  key_params: {max_candidates: "1..4", min_distance: "minimum positive tile improvement"}
  risk: high

operator_rewrite:
  summary: Closed-template arithmetic rewrites with exact-seed authorization and mandatory post-emission proof.
  targets: "'dsp_srl_recurrence_cut_v1', 'fixed_point_dsp_rebuild_v1', 'dsp_mul_two_operand_v1', 'dsp_register_absorb_v1', or 'dsp_pipeline_rebalance_v1'"
  when: >
    Select only when the mechanically collected anonymous motif report supports a
    hypothesis. The skill independently reloads the exact DCP and performs fresh
    private recovery before mutation: recurrence-family boundary recovery for the
    recurrence cut, exact FF-bounded LUT/CARRY product-cone recovery for the
    fixed-point DSP rebuild, exact two-data-bus product-cone recovery for the
    two-operand DSP multiply rebuild, exact fabric FF-bus boundary recovery
    for the placed-DSP input register absorption, or exact placed-DSP
    AREG/BREG-vs-MREG boundary recovery for the in-place pipeline rebalance.
  avoid: >
    Fails closed on stale facts,
    incomplete source contracts, placement-oracle failure, postcheck failure, or strict
    validation failure. Public facts, plans, cells, sites, paths, Tcl, or scripts are
    never accepted. Raw mining, recurrence-recovery, fixed-point-recovery,
    register-absorb-recovery, and pipeline-rebalance-recovery tools are internal
    mechanics, not model-selectable probes.
  key_params: {max_candidates: "exactly 1", route_timeout_s: "scheduling only", min_candidate_remaining_s: "scheduling only"}
  risk: high

critical_cluster_anchor:
  summary: Anchor spread critical cells into a tight bbox pblock, local re-place/route.
  targets: "'auto'"
  when: Placement-spread profiles (critical cells span large X/Y, placement bottleneck).
  avoid: Already-compact placements.
  key_params: {num_paths: "", max_cells: "", bbox_pad_x: "", bbox_pad_y: ""}
  risk: medium

fresh_place_route:
  summary: >
    Full re-place + re-route with named directive recipes, or one shared
    post-place checkpoint followed by an ordered route-directive sibling race.
    Optional clock pressure runs each recipe under a temporary realistic
    period and restores the exact official constraints before measurement.
  targets: >
    legacy registered recipe name: extranetdelay_no_relax |
    extratiming_no_relax | altspread_explore; shared route race uses 'auto'
  when: >
    The routed state is far from what a better directive could achieve
    (directive-sweep class); shallow-logic hard-macro route-dominated
    profiles; after clock retarget. Fixed clock-pressure execution belongs to
    implementation_recipe/derived_pressure_replace_route_v1 when the contest
    period is absurdly tight versus achieved timing (|WNS| many times the
    period): a current-seed-derived near-achievable temporary period restores
    placer/router discrimination. On
    this extreme mismatch, schedule pressure as the first full place/route
    action rather than deferring it behind pblock or repeated replication.
  avoid: >
    < ~20-40 min remaining (a candidate is a full flow); high-util giants
    where a failed route wastes everything — checkpoint first.
  key_params:
    flow_mode: "shared_post_place_route_race for one-prefix route siblings"
    post_place_recipe: "extranetdelay_explore | extratiming_explore | altspread_aggressive"
    route_directives: "ordered allowlisted names; duplicates are removed"
    post_route_phys_opt_preset: "optional fixed phys_opt preset"
    pressure_periods: "internal fixed-preset parameter; not public LLM input"
    max_candidates: "bounds the ordered route prefix"
    recipe_timeout_s: "scheduling only"
  risk: high

endpoint_bel_move:
  summary: Ordered independent same-site endpoint FF BEL-move siblings with local reroute.
  targets: "'auto' or endpoint cell"
  when: >
    Endgame micro-move when the worst path ends in a FF whose sibling BEL is
    free (spam-filter evidence: exactly this move closed the last 15 MHz).
  avoid: Expecting large gains — typically 0.001-0.1 ns each.
  key_params: {num_paths: "", max_candidates: ""}
  risk: low

clock_tighten:
  summary: >
    Re-create the contest clock with a tighter period (factor or explicit
    target), then re-place/route independent recipe/period siblings; an
    optional recap or point repair is ancestry inside that sibling only.
  targets: "'auto' or a registered built-in recipe name; fixed full-flow recipes use implementation_recipe"
  when: >
    The constraint is loose vs achieved timing (positive WNS, or |WNS| a few
    % of period with high baseline Fmax and shallow logic); ALSO as a
    target-period forcing move on deep-slack high-util designs (BOOM 5 ns
    evidence). This changes the SCORED clock period — Fmax = 1000/(period -
    WNS) — so a successful tighten directly raises the score ceiling.
  avoid: >
    Sweeping many factors with < ~15-30 min left; loosest-first ordering
    when time-constrained (use tightest_first + stop_after_first_legal).
  key_params:
    factors: "period multipliers, e.g. [0.92, 0.88, 0.84]"
    target_periods: "explicit ns targets (overrides factors)"
    period_order: "tightest_first recommended under deadline"
    stop_after_first_legal: "stop at first fully-routed win"
  risk: high

path_local_lut_reflow:
  summary: Independent first-pass path-local LUT reflow windows; later greedy passes remain serial descendants.
  targets: "'auto'"
  when: Logic-depth-bound worst paths with LUT headroom near the path.
  avoid: Extreme utilization (no headroom).
  risk: medium

custom:
  summary: >
    Deep-probe escape hatch — call one named read-only MCP tool from the
    configured Vivado or RapidWright allowlist. Raw run_tcl and checkpoint,
    optimization, placement, routing, and artifact-writing tools are not
    available to probes. Results come back into your next decision context.
  targets: "tool name; put arguments in params.arguments"
  when: >
    You need information the compact state doesn't carry (why did a skill
    refuse? what does the worst path look like now? which BELs are free?)
    before committing to an expensive mutation. Budgeted per run.
  avoid: >
    Requesting raw Tcl or any mutation (mutations belong to skills so they
    get measured and rolled back properly).
  key_params: {server: "vivado|rapidwright", arguments: "tool arguments dict"}
  risk: low
